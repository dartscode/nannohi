</style></head><body><header><span class="pill">毎日に、ちょっとした発見を ✨</span><h1>今日はなんの日？＋</h1><div class="sub">日付にちなんだ雑学と、話したくなる朝礼ネタ。</div></header><main><div class="hero"><div class="sub">📅 今日の日付</div><div class="date" id="today">今日の日付</div><div class="fact"><div class="sub">💡 今日の一言雑学</div><h3 id="heroTitle">日付を読み込んでいます</h3><p id="heroFact"></p><div id="heroLabel" class="note"></div></div><button class="btn wide" id="speechOpen">🎤 朝礼スピーチを見る　›</button></div><nav class="nav"><button data-go="day">📅 今日はなんの日？<small>別の日付も調べる</small></button><button data-go="birth">🎂 誕生日<small>曜日・経過日数</small></button><button data-go="love">💕 記念日計算<small>100日・500日・1,000日</small></button></nav><section class="panel" id="day"><h2>📅 日付と雑学</h2><div class="row"><label for="dateInput">調べたい日</label><input type="date" id="dateInput"><button class="btn" id="reset">今日に戻る</button></div><div class="fact"><span class="pill" id="dayLabel"></span><h3 id="dayTitle"></h3><p id="dayFact"></p><div class="source" id="source"></div></div><h2>🎤 朝礼スピーチ</h2><div class="seg"><button data-len="30">30秒目安</button><button data-len="60" class="active">1分目安</button><button data-len="180">3分目安</button></div><div class="result speech" id="speech"></div><div class="row"><button class="btn" id="copy">原稿をコピー</button></div><p class="note">※読み上げ時間は目安です。原稿の長さは日付によって異なります。</p></section><section class="panel" id="birth"><h2>🎂 誕生日タイムトラベル</h2><p class="sub">生まれた曜日と、今日までの日数を計算します。</p><div class="row"><input type="date" id="birthday"><button class="btn" id="calcBirth">調べる</button></div><div class="result" id="birthResult">生年月日を入力してね。</div></section><section class="panel" id="love"><h2>💕 記念日計算</h2><p class="sub">始まった日を1日目として計算します。</p><div class="row"><input type="date" id="startDate"><button class="btn" id="calcLove">計算する</button></div><div class="result" id="loveResult">大切な日を入力してね。</div></section></main><footer>© 2026 今日はなんの日？＋<span class="footer-sep"> · </span><a href="privacy.html">プライバシーポリシー</a></footer><script>
const facts={"10-24":{"label":"国連デー","title":"国連の誕生日は10月24日？","fact":"1945年10月24日、国際連合憲章が発効し、国際連合が正式に発足しました。この日が『国連デー』とされています。","url":"https://www.un.org/en/observances/un-day"},"01-01": {"label": "元日", "title": "新しい年は、なぜ1月1日から？", "fact": "現在広く使われるグレゴリオ暦では、1月1日を一年の始まりとします。世界には別の暦による新年もあります。", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}, "01-07": {"label": "七草がゆ", "title": "春の七草、全部言える？", "fact": "せり、なずな、ごぎょう、はこべら、ほとけのざ、すずな、すずしろ。1月7日に七草がゆを食べる風習があります。", "url": "https://www.maff.go.jp/"}, "01-11": {"label": "鏡開き", "title": "鏡餅を「切る」と言わない理由", "fact": "鏡開きでは、縁起を担いで「切る」ではなく「開く」という言い方が使われます。地域によって日付が異なります。", "url": "https://www.maff.go.jp/"}, "02-03": {"label": "節分のころ", "title": "節分は必ず2月3日？", "fact": "節分は立春の前日。2月3日の年が多いものの、2月2日になる年もあります。選んだ年の節分の日付は暦で確認してください。", "url": "https://eco.mtk.nao.ac.jp/koyomi/"}, "02-11": {"label": "建国記念の日", "title": "「建国記念日」ではない？", "fact": "正式名称は「建国記念の日」。建国された日を断定するのではなく、建国をしのぶ祝日です。", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}, "02-14": {"label": "バレンタインデー", "title": "チョコを贈るのは世界共通？", "fact": "バレンタインデーの贈り物は国や地域によって異なり、日本ではチョコレートを贈る文化が広まりました。", "url": "https://www.britannica.com/topic/Valentines-Day"}, "02-22": {"label": "猫の日", "title": "なぜ2月22日は猫の日？", "fact": "「にゃん・にゃん・にゃん」という語呂合わせから、日本では2月22日が猫の日として親しまれています。", "url": "https://www.petfood.or.jp/"}, "02-23": {"label": "天皇誕生日", "title": "祝日の日付が変わることも？", "fact": "天皇誕生日は在位する天皇の誕生日に合わせた祝日です。現在は2月23日です。", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}, "02-29": {"label": "うるう日", "title": "なぜ4年に一度だけではない？", "fact": "グレゴリオ暦では西暦が4で割り切れる年は原則うるう年。ただし100で割り切れる年は平年、400で割り切れる年はうるう年です。", "url": "https://eco.mtk.nao.ac.jp/koyomi/"}, "03-03": {"label": "ひな祭り", "title": "ひな祭りの「桃」は季節の合図", "fact": "3月3日は桃の節句。ひな人形を飾り、子どもの健やかな成長を願う風習があります。", "url": "https://www.maff.go.jp/"}, "03-08": {"label": "国際女性デー", "title": "3月8日は世界共通の記念日", "fact": "国際女性デーは女性の権利や社会参加について考える国際的な日です。", "url": "https://www.un.org/en/observances/womens-day"}, "03-14": {"label": "ホワイトデー", "title": "ホワイトデーは日本生まれ？", "fact": "3月14日にお返しをするホワイトデーは、日本で広まった商習慣として知られています。", "url": "https://www.japan.travel/"}, "03-20": {"label": "春分のころ", "title": "昼と夜の長さはぴったり同じ？", "fact": "春分は太陽が天の赤道を通過する節目。日の出・日の入りの定義などにより、昼と夜の長さが厳密に同じとは限りません。", "url": "https://eco.mtk.nao.ac.jp/koyomi/"}, "04-01": {"label": "エイプリルフール", "title": "うそをついていい日、起源は謎？", "fact": "エイプリルフールの起源には複数の説があり、決定的な説明はありません。", "url": "https://www.britannica.com/topic/April-Fools-Day"}, "04-07": {"label": "世界保健デー", "title": "WHOができた日", "fact": "1948年4月7日に世界保健機関（WHO）の憲章が発効。これを記念して世界保健デーが設けられています。", "url": "https://www.who.int/campaigns/world-health-day"}, "04-22": {"label": "アースデイ", "title": "地球のことを考える日", "fact": "4月22日のアースデイは、環境保護への関心を高める日として世界各地で取り組みが行われています。", "url": "https://www.earthday.org/"}, "04-29": {"label": "昭和の日", "title": "昭和の日は何を振り返る日？", "fact": "昭和の日は激動の日々を経て復興した昭和の時代を顧み、国の将来に思いをいたす祝日です。", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}, "05-03": {"label": "憲法記念日", "title": "憲法が施行されたのは5月3日", "fact": "日本国憲法は1947年5月3日に施行されました。公布日は前年11月3日です。", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}, "05-04": {"label": "みどりの日", "title": "自然に感謝する祝日", "fact": "みどりの日は自然に親しみ、その恩恵に感謝することを趣旨とした祝日です。", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}, "05-05": {"label": "こどもの日", "title": "こどもの日は母にも感謝する日？", "fact": "祝日法では、こどもの人格を重んじ、幸福をはかるとともに「母に感謝する」日と定められています。", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}, "05-31": {"label": "世界禁煙デー", "title": "たばこについて考える世界共通の日", "fact": "WHOは毎年5月31日を世界禁煙デーとし、たばこによる健康影響などへの理解を促しています。", "url": "https://www.who.int/campaigns/world-no-tobacco-day"}, "06-05": {"label": "世界環境デー", "title": "環境の日はなぜ6月5日？", "fact": "6月5日は国連の世界環境デー。1972年の国連人間環境会議の開催日に由来します。", "url": "https://www.un.org/en/observances/environment-day"}, "06-08": {"label": "世界海洋デー", "title": "海は地球の大部分を覆っている", "fact": "6月8日は世界海洋デー。海洋環境や海との関わりを考える日です。", "url": "https://www.un.org/en/observances/oceans-day"}, "06-21": {"label": "夏至のころ", "title": "一年で昼が最も長いころ", "fact": "北半球では夏至のころに昼の時間が最も長くなります。夏至の日付は年によって変わります。", "url": "https://eco.mtk.nao.ac.jp/koyomi/"}, "07-07": {"label": "七夕", "title": "七夕の願いごとは短冊に", "fact": "七夕は星にまつわる伝承と日本の行事が結びついた年中行事。地域によっては8月に祝います。", "url": "https://www.maff.go.jp/"}, "07-11": {"label": "世界人口デー", "title": "世界人口デーは何を考える日？", "fact": "7月11日は国連の世界人口デー。人口と社会の課題について考える日です。", "url": "https://www.un.org/en/observances/world-population-day"}, "07-20": {"label": "月面着陸の記念日", "title": "人類が初めて月面に降り立った日", "fact": "1969年7月20日（米国時間）、アポロ11号の月着陸船が月面に着陸しました。", "url": "https://www.nasa.gov/mission/apollo-11/"}, "07-30": {"label": "国際友情デー", "title": "友情を祝う国際デー", "fact": "7月30日は国連の国際友情デー。国や文化を超えた友情と相互理解を大切にする日です。", "url": "https://www.un.org/en/observances/friendship-day"}, "08-06": {"label": "広島平和記念日", "title": "8月6日に考えたいこと", "fact": "1945年8月6日、広島に原子爆弾が投下されました。平和の大切さを考える日です。", "url": "https://www.city.hiroshima.lg.jp/"}, "08-09": {"label": "長崎原爆の日", "title": "長崎の歴史を忘れない日", "fact": "1945年8月9日、長崎に原子爆弾が投下されました。被爆の歴史を学び、平和を願う日です。", "url": "https://www.city.nagasaki.lg.jp/"}, "08-11": {"label": "山の日", "title": "山の日は何のための祝日？", "fact": "山に親しむ機会を得て、山の恩恵に感謝するための国民の祝日です。", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}, "08-15": {"label": "終戦の日", "title": "8月15日と戦争の記憶", "fact": "日本では8月15日を戦没者を追悼し平和を祈念する日として位置づけています。", "url": "https://www.mhlw.go.jp/"}, "09-01": {"label": "防災の日", "title": "なぜ9月1日は防災の日？", "fact": "1923年9月1日に発生した関東大震災を教訓に、防災への備えを考える日です。", "url": "https://www.bousai.go.jp/"}, "09-08": {"label": "国際識字デー", "title": "文字を読み書きできることの大切さ", "fact": "9月8日は国際識字デー。教育や読み書きの機会について考える日です。", "url": "https://www.unesco.org/en/days/literacy"}, "09-21": {"label": "国際平和デー", "title": "世界中で平和を願う日", "fact": "9月21日は国連の国際平和デー。非暴力と停戦を呼びかける日です。", "url": "https://www.un.org/en/observances/international-day-peace"}, "09-23": {"label": "秋分のころ", "title": "秋分の日は毎年同じ？", "fact": "秋分の日は天文学上の秋分日で、年によって日付が変わることがあります。", "url": "https://eco.mtk.nao.ac.jp/koyomi/"}, "10-01": {"label": "国際高齢者デー", "title": "年齢を重ねることを考える日", "fact": "10月1日は国連の国際高齢者デー。高齢者の権利や社会参加について考える日です。", "url": "https://www.un.org/en/observances/older-persons-day"}, "10-04": {"label": "世界動物の日", "title": "動物との関わりを考える日", "fact": "10月4日は世界動物の日として、動物福祉や動物との共生を考える取り組みが行われます。", "url": "https://www.worldanimalday.org.uk/"}, "10-10": {"label": "世界メンタルヘルスデー", "title": "心の健康を考える日", "fact": "10月10日は世界メンタルヘルスデー。心の健康への理解を深める日です。", "url": "https://www.who.int/campaigns/world-mental-health-day"}, "10-16": {"label": "世界食料デー", "title": "食べ物の未来を考える日", "fact": "10月16日は国連の世界食料デー。1945年にFAOが設立された日に由来します。", "url": "https://www.fao.org/world-food-day/"}, "10-22": {"label": "京都・時代祭", "title": "時代祭の行列、どの時代から歩く？", "fact": "京都の時代祭は、明治維新から平安時代へと時代をさかのぼる構成の行列で知られます。平安遷都を記念する祭りです。", "url": "https://www.heianjingu.or.jp/festival/jidaisai.html"}, "10-24": {"label": "国連デー", "title": "国連が誕生した日", "fact": "1945年10月24日に国連憲章が発効。10月24日は国連デーです。", "url": "https://www.un.org/en/observances/un-day"}, "10-31": {"label": "ハロウィン", "title": "ハロウィンはもともと何の行事？", "fact": "ハロウィンには古代ケルトの祭りやキリスト教の諸聖人の日の前夜など、複数の歴史的背景があります。", "url": "https://www.britannica.com/topic/Halloween"}, "11-03": {"label": "文化の日", "title": "文化の日は憲法公布の日でもある", "fact": "1946年11月3日に日本国憲法が公布されました。現在は自由と平和を愛し文化をすすめる祝日です。", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}, "11-05": {"label": "世界津波の日", "title": "11月5日は世界津波の日", "fact": "1854年の安政南海地震での「稲むらの火」の逸話にちなみ、国連は11月5日を世界津波の日としています。", "url": "https://www.un.org/en/observances/tsunami-awareness-day"}, "11-20": {"label": "世界こどもの日", "title": "子どもの権利を考える日", "fact": "11月20日は世界こどもの日。1989年の子どもの権利条約採択の日でもあります。", "url": "https://www.unicef.org/world-childrens-day"}, "11-23": {"label": "勤労感謝の日", "title": "勤労感謝の日は誰に感謝する？", "fact": "祝日法では「勤労をたっとび、生産を祝い、国民たがいに感謝しあう」日とされています。", "url": "https://www8.cao.go.jp/chosei/shukujitsu/gaiyou.html"}, "12-01": {"label": "世界エイズデー", "title": "12月1日は世界エイズデー", "fact": "HIV・エイズへの理解を深め、偏見や差別をなくすことを目指す国際的な日です。", "url": "https://www.who.int/campaigns/world-aids-day"}, "12-03": {"label": "国際障害者デー", "title": "誰もが参加しやすい社会へ", "fact": "12月3日は国連の国際障害者デー。障害のある人の権利と社会参加について考える日です。", "url": "https://www.un.org/en/observances/day-of-persons-with-disabilities"}, "12-10": {"label": "世界人権デー", "title": "世界人権宣言が採択された日", "fact": "1948年12月10日に国連総会で世界人権宣言が採択されました。", "url": "https://www.un.org/en/observances/human-rights-day"}, "12-25": {"label": "クリスマス", "title": "クリスマスは誕生日が確定した日？", "fact": "クリスマスはイエス・キリストの誕生を祝う日ですが、実際の誕生日が12月25日と確定しているわけではありません。", "url": "https://www.britannica.com/topic/Christmas"}, "12-31": {"label": "大晦日", "title": "「大晦日」の晦日って何？", "fact": "「晦日（みそか）」は月の最後の日のこと。12月の晦日なので「大晦日」と呼ばれます。", "url": "https://www.kotobank.jp/"}};

Object.assign(facts,{"10-23": {"label": "モルの日", "title": "10月23日が「モルの日」なのはなぜ？", "fact": "化学で物質の量を表す「モル」。1モルに含まれる粒子の数は約6.02×10の23乗個。この「6.02×10²³」にちなみ、米国などでは10月23日の午前6時02分から午後6時02分を「モルの日」として親しんでいます。", "url": "https://www.moleday.org/"}, "10-25": {"label": "世界パスタデー", "title": "パスタに「世界記念日」がある？", "fact": "10月25日は世界パスタデー。1995年にローマで開かれた第1回世界パスタ会議を記念する日として、パスタの魅力や食文化を紹介する取り組みが行われています。", "url": "https://internationalpasta.org/world-pasta-day/"}, "10-27": {"label": "世界視聴覚遺産の日", "title": "昔の映像や音声も「遺産」になる？", "fact": "10月27日はユネスコが定める「世界視聴覚遺産の日」。映画、録音、放送記録など、過去の声や映像を未来へ残す大切さを考える日です。", "url": "https://www.unesco.org/en/days/audiovisual-heritage"}, "10-28": {"label": "国際アニメーションデー", "title": "アニメの原点は1892年のパリ？", "fact": "10月28日は国際アニメーションデー。1892年10月28日にエミール・レイノーがパリで光学劇場の公開上映を始めたことにちなみ、国際アニメーション映画協会（ASIFA）が制定しました。", "url": "https://asifa.net/international-animation-day/"}, "10-29": {"label": "世界脳卒中デー", "title": "脳卒中は「時間」が大切な病気", "fact": "10月29日は世界脳卒中デー。脳卒中の兆候への気づきと、迅速な医療につなげることの大切さを広める国際的な日です。", "url": "https://www.world-stroke.org/world-stroke-day-campaign"}});

Object.assign(facts,{"11-10":{"label":"世界科学デー","title":"科学は研究室の中だけのもの？","fact":"11月10日はユネスコの「平和と開発のための世界科学デー」。科学が社会や暮らしに果たす役割を考え、科学と市民のつながりを深める日です。","url":"https://www.unesco.org/en/days/science-peace-development"},"11-19":{"label":"世界トイレの日","title":"トイレにも「世界記念日」がある？","fact":"11月19日は国連の「世界トイレの日」。安全に利用できる衛生設備の大切さや、世界で衛生環境の整備が必要とされている現状を考える日です。","url":"https://www.un.org/en/observances/toilet-day"},"12-05":{"label":"国際ボランティア・デー","title":"「誰かのため」の行動に世界共通の日","fact":"12月5日は国連の「国際ボランティア・デー」。ボランティアの貢献を認め、地域や社会を支える活動への理解を深める日です。","url":"https://www.un.org/en/observances/volunteer-day"},"12-11":{"label":"国際山岳デー","title":"山を守るための国際デーがある？","fact":"12月11日は国連の「国際山岳デー」。山々が水や生態系、人々の暮らしを支える役割に注目し、山岳地域の持続可能な発展を考える日です。","url":"https://www.un.org/en/observances/mountain-day"}});

/* Ver.14: 公式国際デー資料に基づく日付固有の雑学（既存記事を上書きしない） */
Object.assign(facts,{"01-04":{"label":"世界点字デー","title":"点字は「読む文字」だけじゃない？","fact":"1月4日は世界点字デー。点字は指先で読む文字として、視覚に障害のある人の情報へのアクセスや自立を支えています。","url":"https://www.un.org/en/observances/braille-day"},"01-24":{"label":"国際教育デー","title":"学校で学べることは当たり前？","fact":"1月24日は国連が定める国際教育デー。教育を受けることは人権の一つで、平和や持続可能な社会づくりにもつながります。","url":"https://www.un.org/en/observances/education-day"},"01-26":{"label":"国際クリーンエネルギー・デー","title":"エネルギーを「つくる方法」にも記念日？","fact":"1月26日は国際クリーンエネルギー・デー。環境への負担を抑えながら、誰もがエネルギーを利用できる未来について考える日です。","url":"https://www.un.org/en/observances/clean-energy-day"},"01-27":{"label":"ホロコースト犠牲者を想起する国際デー","title":"1月27日に世界が歴史を振り返る理由","fact":"1945年1月27日はアウシュビッツ＝ビルケナウ強制収容所が解放された日。国連はこの日をホロコースト犠牲者を想起する国際デーとしています。","url":"https://www.un.org/en/observances/commemoration-holocaust-victims-day"},"02-02":{"label":"世界湿地の日","title":"湿地は「ただの水たまり」じゃない？","fact":"2月2日は世界湿地の日。湿地は多様な生き物のすみかとなり、水の循環や暮らしを支える大切な環境です。","url":"https://www.un.org/en/observances/world-wetlands-day"},"02-04":{"label":"国際人類友愛デー","title":"意見が違う人とも、どう向き合う？","fact":"2月4日は国際人類友愛デー。文化や信仰の違いを超えて、お互いの尊厳を認め、対話を大切にする日です。","url":"https://www.un.org/en/observances/human-fraternity"},"02-10":{"label":"世界豆類デー","title":"豆が世界の記念日になった理由","fact":"2月10日は国連の世界豆類デー。豆類は食生活に役立つだけでなく、持続可能な農業との関わりからも注目されています。","url":"https://www.un.org/en/observances/world-pulses-day"},"02-13":{"label":"世界ラジオデー","title":"ラジオに世界共通の記念日がある？","fact":"2月13日は世界ラジオデー。ラジオは身近な情報源であるとともに、災害時などに情報を伝える手段としても役立ちます。","url":"https://www.un.org/en/observances/radio-day"},"02-20":{"label":"世界社会正義の日","title":"「公平」と「平等」は同じ？","fact":"2月20日は世界社会正義の日。誰もが尊重され、働く機会や社会参加の機会を得られる社会について考える日です。","url":"https://www.un.org/en/observances/social-justice-day"},"02-21":{"label":"国際母語デー","title":"いつもの言葉も、守るべき文化？","fact":"2月21日は国際母語デー。世界の多様な言語を大切にし、母語で学ぶ機会や言語文化の継承について考える日です。","url":"https://www.un.org/en/observances/mother-language-day"},"03-01":{"label":"差別ゼロの日","title":"何気ない決めつけも差別につながる？","fact":"3月1日は差別ゼロの日。国連合同エイズ計画（UNAIDS）が提唱し、誰もが差別なく尊重される社会を目指す日です。","url":"https://www.unaids.org/en/zero-discrimination-day"},"03-21":{"label":"国際森林デー","title":"森には木材以外にどんな役割がある？","fact":"3月21日は国際森林デー。森林は多くの生物のすみかであり、水や土壌の保全にも関わる大切な環境です。","url":"https://www.un.org/en/events/forestsday/"},"03-22":{"label":"世界水の日","title":"蛇口をひねれば水が出るのは当たり前？","fact":"3月22日は世界水の日。安全な水を利用できることの大切さや、水資源を守る必要性について考える日です。","url":"https://www.un.org/en/observances/water-day"},"03-23":{"label":"世界気象デー","title":"天気予報にも国際的な記念日？","fact":"3月23日は世界気象デー。1950年に世界気象機関（WMO）の条約が発効した日にちなみ、気象観測や国際協力の大切さを伝えます。","url":"https://wmo.int/world-meteorological-day"},"03-30":{"label":"国際ごみゼロデー","title":"ごみを「捨てた後」より前に考える日","fact":"3月30日は国際ごみゼロデー。廃棄物を減らし、資源を無駄にしない暮らしや社会の仕組みを考える日です。","url":"https://www.un.org/en/observances/zero-waste-day"},"04-02":{"label":"世界自閉症啓発デー","title":"「知る」から「受け入れる」へ","fact":"4月2日は世界自閉症啓発デー。自閉症のある人の権利や尊厳を尊重し、誰もが参加できる社会について考える日です。","url":"https://www.un.org/en/observances/autism-day"},"04-06":{"label":"開発と平和のためのスポーツ国際デー","title":"スポーツが国境を越える理由","fact":"4月6日は開発と平和のためのスポーツ国際デー。スポーツを通じた交流や協力、互いを尊重する姿勢に目を向ける日です。","url":"https://www.un.org/en/observances/sport-day"},"04-23":{"label":"世界図書・著作権デー","title":"本を読むことと、著作権の意外な関係","fact":"4月23日はユネスコの世界図書・著作権デー。読書の楽しさと、作品を生み出す人の権利の両方について考える日です。","url":"https://www.unesco.org/en/days/world-book-and-copyright"},"04-26":{"label":"国際チェルノブイリ災害想起デー","title":"1986年4月26日を忘れないために","fact":"1986年4月26日にチェルノブイリ原子力発電所で事故が発生しました。国連はこの日を災害の影響と復興を考える国際デーとしています。","url":"https://www.un.org/en/observances/chernobyl-remembrance-day"},"05-15":{"label":"国際家族デー","title":"家族の形は一つだけ？","fact":"5月15日は国際家族デー。さまざまな家族のあり方を理解し、家族と社会を支える仕組みについて考える日です。","url":"https://www.un.org/en/observances/international-day-of-families"},"05-22":{"label":"国際生物多様性の日","title":"生き物の種類が多いことはなぜ大切？","fact":"5月22日は国際生物多様性の日。さまざまな生き物とそのつながりが、私たちの暮らしを支えていることに目を向ける日です。","url":"https://www.un.org/en/observances/biological-diversity-day"},"06-17":{"label":"砂漠化と干ばつに対処する世界デー","title":"砂漠化は砂漠だけの問題？","fact":"6月17日は砂漠化と干ばつに対処する世界デー。土地の劣化や水不足を防ぎ、持続可能な土地利用について考える日です。","url":"https://www.un.org/en/observances/desertification-day"},"09-07":{"label":"青空のためのきれいな空気の国際デー","title":"空気のきれいさを考える記念日","fact":"9月7日は青空のためのきれいな空気の国際デー。大気汚染の影響を知り、空気の質を改善する取り組みを考える日です。","url":"https://www.un.org/en/observances/clean-air-day"}});

/* Ver.16: 国連広報センターの国際デー一覧に照合した追加日付。 */
Object.assign(facts,{"01-04":{"label":"世界点字デー","title":"点字はなぜ指先で読める？","fact":"1月4日は世界点字デー。点字は盛り上がった点の組み合わせを指先で読み取る文字で、視覚に頼らない情報へのアクセスを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"01-26":{"label":"クリーンエネルギーの国際デー","title":"エネルギーの「つくり方」も記念日に？","fact":"1月26日はクリーンエネルギーの国際デー。暮らしや産業に必要なエネルギーを、環境への負荷と両立しながら確保することを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"01-27":{"label":"ホロコースト犠牲者を想起する国際デー","title":"1月27日に世界が記憶をつなぐ理由","fact":"1月27日はホロコーストの犠牲者を想起する国際デー。過去の迫害を忘れず、差別や憎悪が生まれる社会の危険について考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"02-02":{"label":"世界湿地の日","title":"湿地はただの「ぬかるみ」じゃない？","fact":"2月2日は世界湿地の日。湿地は水を蓄え、多くの生き物を支える場所です。湿地の保全と賢明な利用を考える国際的な日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"02-10":{"label":"世界豆デー","title":"豆が世界の食を支える理由","fact":"2月10日は世界豆デー。豆類はさまざまな料理で使われ、たんぱく質などの栄養源にもなります。食料と持続可能な農業を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"02-13":{"label":"世界ラジオ・デー","title":"音だけのメディアが今も大切な理由","fact":"2月13日は世界ラジオ・デー。映像がなくても情報を届けられるラジオの役割や、災害時を含む情報へのアクセスを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"02-17":{"label":"世界観光レジリエンスの日","title":"旅先にも「立ち直る力」が必要？","fact":"2月17日は世界観光レジリエンスの日。災害や危機から観光産業と地域が回復し、持続できる仕組みを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"02-20":{"label":"世界社会正義の日","title":"「公平」と「平等」は同じ？","fact":"2月20日は世界社会正義の日。働く機会や暮らしの条件など、誰もが尊厳を持って生きられる社会について考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"02-21":{"label":"国際母語デー","title":"世界にはいくつもの「母語」がある","fact":"2月21日は国際母語デー。自分が最初に身につけた言葉だけでなく、世界の多様な言語や文化を守る大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"03-01":{"label":"エイズ差別ゼロの日","title":"病気への理解と差別は別の問題","fact":"3月1日はエイズ差別ゼロの日。HIVに関する正しい知識を広め、健康状態などを理由に人を差別しない社会を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"03-03":{"label":"世界野生生物の日","title":"野生生物を守ることが暮らしにつながる？","fact":"3月3日は世界野生生物の日。野生の動植物の多様さと、自然を守ることが私たちの暮らしにも関わる点を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"03-10":{"label":"女性裁判官の国際デー","title":"裁判所の多様性を考える日","fact":"3月10日は女性裁判官の国際デー。司法の場に多様な人が参加する意義や、公平な司法へのアクセスを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"03-20":{"label":"国際幸福デー","title":"幸せを世界共通のテーマとして考える日","fact":"3月20日は国際幸福デー。幸福や生活の質を、経済的な豊かさだけでなく幅広い視点から考える国際デーです。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"03-21":{"label":"国際人種差別撤廃デー","title":"3月21日は差別について考える日","fact":"3月21日は国際人種差別撤廃デー。人種や出自による差別をなくし、すべての人の尊厳を守ることを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"04-28":{"label":"職場での安全と健康のための世界デー","title":"仕事の「安全」を世界で考える日","fact":"4月28日は職場での安全と健康のための世界デー。事故や職業病を防ぎ、安心して働ける環境をつくることを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"04-30":{"label":"国際ジャズ・デー","title":"ジャズにも国際的な記念日がある？","fact":"4月30日は国際ジャズ・デー。音楽を通じた文化交流や対話、異なる背景を持つ人々のつながりを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-02":{"label":"世界まぐろデー","title":"マグロにも国連の記念日がある？","fact":"5月2日は世界まぐろデー。世界の食卓で親しまれるマグロについて、資源管理や持続可能な漁業の大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-08":{"label":"第二次世界大戦の犠牲者を追悼する日","title":"5月8日、世界が戦争の犠牲を振り返る","fact":"5月8日と9日は、第二次世界大戦で命を失った人々を追悼し、和解を考える国連の機会とされています。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-12":{"label":"植物の健康の国際デー","title":"植物にも「健康」がある？","fact":"5月12日は植物の健康の国際デー。植物の病気や害虫から農作物と自然を守ることが、食料や生態系の維持につながると考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-15":{"label":"国際家族デー","title":"家族の形は一つじゃない","fact":"5月15日は国際家族デー。さまざまな家族のあり方と、家族を支える社会の仕組みについて考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-16":{"label":"光の国際デー","title":"光がなければインターネットも困る？","fact":"5月16日は光の国際デー。光は照明だけでなく、科学研究や通信、医療など幅広い分野で使われています。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-17":{"label":"世界電気通信情報社会デー","title":"離れた人とつながれる当たり前","fact":"5月17日は世界電気通信情報社会デー。通信技術の役割と、誰もが情報を利用できる環境づくりを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-20":{"label":"世界ミツバチの日","title":"ミツバチはハチミツだけじゃない？","fact":"5月20日は世界ミツバチの日。ミツバチなどの送粉者は植物の受粉を助け、農業や生物多様性にも関わっています。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-21":{"label":"国際お茶の日","title":"お茶は飲み物だけでなく産業でもある","fact":"5月21日は国際お茶の日。お茶を楽しむ文化と、生産する人々の暮らしや持続可能な農業について考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-22":{"label":"国際生物多様性の日","title":"生き物の種類が多いことに意味がある？","fact":"5月22日は国際生物多様性の日。多様な生き物と生態系のつながりが、食料や水などの暮らしを支えていることを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-25":{"label":"世界フットボール・デー","title":"サッカーに国連の記念日ができた？","fact":"5月25日は世界フットボール・デー。サッカーを通じた交流や、スポーツが人と人を結ぶ力に注目する日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-29":{"label":"国連平和維持要員の国際デー","title":"平和を支える仕事にも記念日がある","fact":"5月29日は国連平和維持要員の国際デー。紛争地域などで平和維持に携わる人々の活動と犠牲を振り返る日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"05-30":{"label":"国際ポテト・デー","title":"ジャガイモにも国際デーがある？","fact":"5月30日は国際ポテト・デー。ジャガイモは世界各地で栽培される作物で、食料や農業に果たす役割を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"06-01":{"label":"国際親の日","title":"親への感謝を世界で考える日","fact":"6月1日は国際親の日。子どもを育てる親の役割や、家庭を社会全体で支えることの大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"06-03":{"label":"世界自転車デー","title":"自転車は身近な交通手段であり運動でもある","fact":"6月3日は世界自転車デー。自転車の手軽さと、移動・健康・環境に関わる役割を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"06-30":{"label":"国際小惑星デー","title":"宇宙の小さな天体を知る日","fact":"6月30日は国際小惑星デー。小惑星について学び、地球に近づく天体の観測や宇宙の研究を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"07-06":{"label":"世界農村開発デー","title":"農村は食料を作るだけの場所？","fact":"7月6日は世界農村開発デー。農村地域の暮らしや生産活動を支え、持続可能な発展につなげることを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"07-12":{"label":"砂塵嵐と闘う国際デー","title":"遠くの砂ぼこりが暮らしに影響する？","fact":"7月12日は砂塵嵐と闘う国際デー。砂やほこりを伴う嵐が健康や交通、農業に及ぼす影響と対策を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"07-15":{"label":"世界ユース技能デー","title":"若い世代の「技能」に注目する日","fact":"7月15日は世界ユース技能デー。若い人が仕事や社会で活躍するために必要な技能や学ぶ機会を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"07-18":{"label":"ネルソン・マンデラ国際デー","title":"一人の人生が国際デーになった理由","fact":"7月18日はネルソン・マンデラ国際デー。人権や平等のために行動した歩みを振り返り、社会に貢献することを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"07-25":{"label":"世界溺水防止デー","title":"水の事故を防ぐための国際デー","fact":"7月25日は世界溺水防止デー。海や川、プールなどでの溺水事故を防ぐため、身近な安全対策を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"07-28":{"label":"世界肝炎デー","title":"肝臓の病気を知る世界共通の日","fact":"7月28日は世界肝炎デー。ウイルス性肝炎などへの理解を深め、検査や予防、治療につなげることを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"08-12":{"label":"国際青少年デー","title":"若い世代の声を社会に生かす日","fact":"8月12日は国際青少年デー。若者が直面する課題や、社会づくりに参加する機会について考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"08-19":{"label":"世界人道デー","title":"危機の現場で人を支える仕事","fact":"8月19日は世界人道デー。災害や紛争の影響を受けた人々への支援と、支援に携わる人々の活動を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"08-23":{"label":"奴隷貿易とその廃止を記念する国際デー","title":"歴史を知ることが差別を考える第一歩","fact":"8月23日は奴隷貿易とその廃止を記念する国際デー。歴史を振り返り、今も残る差別や人権の問題を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"08-27":{"label":"世界湖沼の日","title":"湖や沼は身近な自然の宝庫","fact":"8月27日は世界湖沼の日。湖や沼が生き物のすみかや水資源として果たす役割と、その保全を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"08-29":{"label":"核実験に反対する国際デー","title":"核実験をなくすために考える日","fact":"8月29日は核実験に反対する国際デー。核実験が人々や環境に及ぼす影響を振り返り、核実験のない世界を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-05":{"label":"国際チャリティー・デー","title":"寄付や助け合いを考える日","fact":"9月5日は国際チャリティー・デー。困っている人を支える寄付や慈善活動の役割を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-07":{"label":"青空のためのきれいな空気の国際デー","title":"きれいな空気は誰にとっても大切","fact":"9月7日は青空のためのきれいな空気の国際デー。大気汚染の影響や、健康と環境を守る取り組みを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-09":{"label":"教育を攻撃から守るための国際デー","title":"学ぶ場所を守るということ","fact":"9月9日は教育を攻撃から守るための国際デー。紛争などの中でも子どもたちが安全に学べる環境の大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-12":{"label":"国連南南協力デー","title":"国同士が知恵を持ち寄る日","fact":"9月12日は国連南南協力デー。開発途上国同士が知識や経験を共有し、課題の解決に協力する取り組みを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-15":{"label":"国際民主主義デー","title":"意見を届ける仕組みを考える日","fact":"9月15日は国際民主主義デー。人々が政治や社会の意思決定に参加する仕組みと、その大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-16":{"label":"オゾン層保護のための国際デー","title":"オゾン層は地球の「日傘」？","fact":"9月16日はオゾン層保護のための国際デー。オゾン層は太陽からの有害な紫外線を吸収する働きがあり、その保護を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-17":{"label":"世界患者安全デー","title":"医療にも「安全文化」が必要","fact":"9月17日は世界患者安全デー。医療を受ける人の安全を守り、医療現場での事故や危険を減らすことを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-18":{"label":"国際同一賃金デー","title":"同じ価値の仕事と報酬を考える日","fact":"9月18日は国際同一賃金デー。同じ価値の労働に対して公平な報酬を得られる社会を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-20":{"label":"世界クリーンアップ・デー","title":"ごみを減らす取り組みを世界で","fact":"9月20日は世界クリーンアップ・デー。ごみの問題を知り、清掃やごみの削減を通じて環境を守ることを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-26":{"label":"核兵器の全面的廃絶のための国際デー","title":"核兵器のない世界を考える日","fact":"9月26日は核兵器の全面的廃絶のための国際デー。核兵器がもたらす危険を考え、廃絶に向けた国際的な取り組みに目を向ける日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-27":{"label":"世界観光デー","title":"旅は地域の暮らしにもつながる","fact":"9月27日は世界観光デー。観光が文化交流や地域経済に果たす役割と、持続可能な観光のあり方を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-28":{"label":"情報へのユニバーサル・アクセスのための国際デー","title":"知りたい情報に誰もがアクセスできる？","fact":"9月28日は情報へのユニバーサル・アクセスのための国際デー。必要な情報を誰もが得られることの大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-29":{"label":"食料ロスと廃棄に関する啓発の国際デー","title":"食べられるのに捨てられる食料","fact":"9月29日は食料ロスと廃棄に関する啓発の国際デー。生産から食卓までの無駄を減らす工夫を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"09-30":{"label":"国際翻訳デー","title":"言葉をつなぐ人たちの記念日","fact":"9月30日は国際翻訳デー。異なる言語を使う人同士の理解を助ける翻訳や通訳の仕事に目を向ける日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"10-02":{"label":"国際非暴力デー","title":"対立を暴力以外で解決するには？","fact":"10月2日は国際非暴力デー。意見が違う相手とも、暴力ではなく対話や平和的な方法で向き合うことを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"10-05":{"label":"世界教師デー","title":"教える人にも国際的な記念日がある","fact":"10月5日は世界教師デー。学校などで学びを支える先生の役割と、教育環境の大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"10-07":{"label":"世界コットンの日","title":"綿は服になる前から世界とつながっている","fact":"10月7日は世界コットンの日。綿花が衣類や産業、綿を生産する地域の暮らしに果たす役割を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"10-09":{"label":"世界郵便の日","title":"手紙を届ける仕組みも国際協力","fact":"10月9日は世界郵便の日。国境を越えて手紙や荷物を届ける郵便ネットワークの役割を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"10-11":{"label":"国際ガールズ・デー","title":"女の子の可能性を広げる日","fact":"10月11日は国際ガールズ・デー。女の子が学び、自分の未来を選べる機会や権利について考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"10-13":{"label":"国際防災の日","title":"災害が起きる前にできること","fact":"10月13日は国際防災の日。災害による被害を減らすために、日頃から備えることの大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"10-15":{"label":"農山漁村女性のための国際デー","title":"食卓を支える仕事に目を向ける日","fact":"10月15日は農山漁村女性のための国際デー。農業や地域の暮らしを支える女性たちの役割と課題を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"10-17":{"label":"貧困撲滅のための国際デー","title":"貧困を数字だけで見ないために","fact":"10月17日は貧困撲滅のための国際デー。暮らしの困難に直面する人々の声と、誰も取り残さない社会を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"11-02":{"label":"ジャーナリストへの犯罪不処罰をなくす国際デー","title":"取材する人の安全も大切","fact":"11月2日はジャーナリストへの犯罪不処罰をなくす国際デー。報道に携わる人の安全と、事件の責任を明らかにする重要性を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"11-06":{"label":"戦争と武力紛争による環境搾取防止のための国際デー","title":"戦争は自然環境にも傷を残す","fact":"11月6日は戦争と武力紛争による環境搾取防止のための国際デー。紛争が土地や水、自然に与える影響を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"11-14":{"label":"世界糖尿病デー","title":"糖尿病について知る国際的な日","fact":"11月14日は世界糖尿病デー。糖尿病への理解を深め、予防や早期発見、適切な治療の大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"11-16":{"label":"国際寛容デー","title":"「違い」を認めることの大切さ","fact":"11月16日は国際寛容デー。考え方や文化の違いを尊重し、対話を通じて理解を深めることを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"11-21":{"label":"世界テレビ・デー","title":"テレビが世界をつないできた理由","fact":"11月21日は世界テレビ・デー。テレビがニュースや文化、教育の情報を届けてきた役割を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"11-25":{"label":"女性に対する暴力撤廃の国際デー","title":"安心して暮らせる社会のために","fact":"11月25日は女性に対する暴力撤廃の国際デー。女性への暴力をなくし、安全と尊厳を守る取り組みを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"11-26":{"label":"持続可能な輸送の世界デー","title":"運ぶことも地球の未来につながる","fact":"11月26日は持続可能な輸送の世界デー。人や物を運ぶ仕組みを、環境や暮らしへの影響とともに考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"11-30":{"label":"化学兵器による全ての犠牲者を追悼する日","title":"化学兵器の被害を忘れない日","fact":"11月30日は化学兵器によるすべての犠牲者を追悼する日。被害を記憶し、化学兵器のない世界を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"12-02":{"label":"奴隷制度廃止国際デー","title":"自由を奪う仕組みをなくすために","fact":"12月2日は奴隷制度廃止国際デー。人身取引や強制労働など、現代にも残る搾取の問題を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"12-07":{"label":"国際民間航空デー","title":"飛行機が世界を結ぶ仕組み","fact":"12月7日は国際民間航空デー。航空交通が人や物を結ぶ役割と、安全な国際航空の大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"12-09":{"label":"国際腐敗防止デー","title":"信頼を守るためのルール","fact":"12月9日は国際腐敗防止デー。不正や汚職が社会の信頼を損なうことを知り、透明性や公正さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"12-12":{"label":"ユニバーサル・ヘルス・カバレッジ国際デー","title":"必要な医療を受けられる社会へ","fact":"12月12日はユニバーサル・ヘルス・カバレッジ国際デー。誰もが必要な保健医療サービスを利用できる社会を考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"},"12-18":{"label":"国際移住者デー","title":"国境を越えて暮らす人々のこと","fact":"12月18日は国際移住者デー。さまざまな事情で移動する人々の権利や、移住先の社会との関わりを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/"}});

Object.assign(facts,{"01-28":{"label":"平和的共存の国際デー","title":"違いがあっても一緒に暮らすには","fact":"1月28日は国連の「平和的共存の国際デー」。考え方や文化が違う人同士でも、尊重し合って共に暮らすことの大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/","sourceType":"index","sourceVerified":"date-title"},"03-24":{"label":"世界結核デー","title":"昔の病気だと思っていない？","fact":"3月24日は「世界結核デー」。結核は現在も世界で対策が必要な感染症で、早期発見や適切な治療の重要性を伝える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/","sourceType":"index","sourceVerified":"date-title"},"04-04":{"label":"地雷に関する啓発の国際デー","title":"戦争が終わっても危険が残る","fact":"4月4日は国連の「地雷に関する啓発および地雷除去支援のための国際デー」。紛争後も残る地雷の危険と除去の必要性を考えます。","url":"https://www.unic.or.jp/activities/international_observances/days/","sourceType":"index","sourceVerified":"date-title"},"04-12":{"label":"国際有人宇宙飛行デー","title":"人類が初めて宇宙へ飛び立った日","fact":"1961年4月12日、ユーリ・ガガーリンが人類初の有人宇宙飛行を行いました。国連はこの日を「国際有人宇宙飛行デー」としています。","url":"https://www.unic.or.jp/activities/international_observances/days/","sourceType":"index","sourceVerified":"date-title"},"04-21":{"label":"創造性とイノベーションの世界デー","title":"新しい発想は小さな疑問から","fact":"4月21日は国連の「創造性とイノベーションの世界デー」。課題を解決するための新しい発想や工夫の大切さを考える日です。","url":"https://www.unic.or.jp/activities/international_observances/days/","sourceType":"index","sourceVerified":"date-title"}});

Object.assign(facts,{"02-06":{"label":"女性器切除の根絶のための国際デー","title":"慣習にも見直すべきものがある？","fact":"2月6日は女性器切除の根絶を訴える国際デー。健康と人権を守るため、国際機関が啓発を続けています。","url":"https://www.un.org/en/observances/list-days-weeks"},"02-12":{"label":"暴力的過激主義防止の国際デー","title":"対立が深まる前にできることは？","fact":"2月12日は、テロにつながり得る暴力的過激主義の防止について考える国連の国際デーです。","url":"https://www.un.org/en/observances/list-days-weeks"},"03-05":{"label":"軍縮と不拡散の啓発のための国際デー","title":"兵器を減らすために必要なことは？","fact":"3月5日は軍縮と不拡散について知る国際デー。兵器の拡散を防ぐための国際的な協力に目を向ける日です。","url":"https://www.un.org/en/observances/list-days-weeks"},"03-15":{"label":"イスラム嫌悪と闘う国際デー","title":"偏見はどこから生まれる？","fact":"3月15日はイスラム嫌悪と闘う国際デー。宗教を理由とする差別や偏見をなくすため、理解を深める日です。","url":"https://www.un.org/en/observances/list-days-weeks"},"03-25":{"label":"奴隷制と大西洋奴隷貿易の犠牲者追悼国際デー","title":"歴史を学ぶことが未来につながる？","fact":"3月25日は奴隷制と大西洋奴隷貿易の犠牲者を追悼する国際デー。歴史の記憶を受け継ぎ、差別を考える日です。","url":"https://www.un.org/en/observances/list-days-weeks"},"04-05":{"label":"良心の国際デー","title":"自分の良心に従うってどういうこと？","fact":"4月5日は国連の「良心の国際デー」。他者への思いやりや平和的な行動について考える日です。","url":"https://www.un.org/en/observances/list-days-weeks"},"04-25":{"label":"世界マラリアデー","title":"蚊が運ぶ病気への対策とは？","fact":"4月25日は世界マラリアデー。蚊を介して広がるマラリアの予防、検査、治療の重要性を伝える日です。","url":"https://www.un.org/en/observances/list-days-weeks"},"06-14":{"label":"世界献血者デー","title":"献血にも世界記念日がある？","fact":"6月14日は世界献血者デー。献血に協力する人々に感謝し、安全な血液を必要とする人を支える大切さを伝える日です。","url":"https://www.un.org/en/observances/list-days-weeks"},"06-15":{"label":"高齢者虐待啓発デー","title":"年齢を重ねた人の尊厳を守るには？","fact":"6月15日は高齢者虐待について考える国際デー。暴力や搾取を防ぎ、高齢者の尊厳と安全を守る大切さを伝えます。","url":"https://www.un.org/en/observances/list-days-weeks"},"06-18":{"label":"持続可能な食文化の日","title":"食べ方も未来を変える？","fact":"6月18日は「持続可能な食文化の日」。食材の生産から調理、食文化まで、環境や地域に配慮した食のあり方を考える日です。","url":"https://www.un.org/en/observances/list-days-weeks"},"06-20":{"label":"世界難民の日","title":"故郷を離れざるを得ない人たちのこと","fact":"6月20日は世界難民の日。紛争や迫害などで故郷を離れた人々の状況を知り、支援について考える日です。","url":"https://www.un.org/en/observances/list-days-weeks"},"12-20":{"label":"国際人間連帯デー","title":"支え合い "10-23":{
30:`皆さん、今日10月23日は「モルの日」です。

モルって何？と思いますよね。卵を12個まとめて「1ダース」と呼ぶように、化学では小さな粒を約6.02×10の23乗という、とんでもない数でひとまとめにして「1モル」と呼びます。

その数字の「10の23乗」にちなんで10月23日。数字から生まれた、ちょっと変わった記念日です。`,
60:`皆さん、今日10月23日、化学好きの人にはちょっと特別な日なんです。

その名も「モルの日」。……モルって何？って思いますよね。

例えば卵は12個で「1ダース」。実は化学にも、ものをまとめて数える単位があります。それが「モル」です。

ただし、その数が桁違い。1モルは約6.02×10の23乗の、とてつもない数なんです。正確には約6.02かける10の23乗個。

そこで、この数字の「10の23乗」にちなんで、10月23日がモルの日になりました。アメリカでは朝6時02分から夕方6時02分まで祝う、という遊び心もあります。

卵なら12個、分子なら約6000垓個。数える相手が変わると、ひとまとめの大きさもこんなに変わるんですね。`,
180:`皆さん、突然ですがクイズです。

卵12個は「1ダース」。では、化学で使う「1モル」は、いったい何個でしょう？

100個？ 1万個？ それとも1億個？

実は、どれも全然足りません。答えは、約6.02かける10の23乗個。日本語で言うと、約6020垓個です。

……もはや、大きすぎて想像できませんよね。

でも、そもそもなぜ、そんな巨大な数が必要なんでしょうか。

例えば、砂糖をひとつまみ取ったとします。そこに含まれる分子を、一粒ずつ数えるなんて無理ですよね。原子や分子はそれくらい小さいんです。

そこで科学者は、卵を「ダース」で数えるように、原子や分子も巨大なひとまとまりで数えることにしました。それが「モル」です。

面白いのは、ここからです。

今日10月23日は「モルの日」と呼ばれています。1モルの数を表す「6.02かける10の23乗」から、アメリカ式の日付で10月23日、そして朝6時02分から夕方6時02分まで、という記念日にしてしまったんです。

60:`皆さん、10月23日が何の日か、ご存じですか？\n\n実は「モルの日」と呼ばれる日なんです。……と言われても、モルって何？ となりますよね。\n\n化学で使う「モル」は、物質の粒の数をまとめて数えるための単位です。例えば、卵は12個で1ダース。でも、原子や分子は小さすぎるので、もっと大きなまとまりで数えます。\n\nその1モルが、約6.02かける10の23乗個。ものすごい数ですよね。\n\nこの数字の「6・02」と「23」を取って、10月23日の朝6時02分から夕方6時02分までを「モルの日」として楽しむ文化があるんです。\n\n卵のダースと、目に見えない分子。大きさは全然違っても、まとめて数える発想は同じ。今日はそんな、数字に隠れた面白い記念日をご紹介しました。`,
180:`皆さん、今日は10月23日です。\n\nいきなりですが、「1ダース」は何個か分かりますか？ そう、12個ですよね。では「1モル」は何個でしょう？\n\n答えは、およそ6.02かける10の23乗個。ゼロがずらっと並ぶ、とんでもなく大きな数です。\n\n「モル」というのは、化学で原子や分子などの数をまとめて表す単位です。卵を12個まとめて1ダースと呼ぶように、目に見えない小さな粒を、とても大きな数でひとまとめにするんです。\n\nそして面白いのが、今日の日付。10月23日は「モルの日」と呼ばれています。なぜかというと、1モルを表す数の「6・02」と「10の23乗」から、10月23日の朝6時02分から夕方6時02分までをお祝いする、という発想なんです。\n\n科学の記念日なのに、なんだか語呂合わせみたいですよね。\n\nそもそも私たちは、普段から数をまとめて考えています。卵は1パック、紙は1束、時間は1時間。数え方を工夫することで、扱いにくいものも分かりやすくなります。\n\n化学の世界でも同じです。原子や分子を一つずつ数えるなんて、とてもできません。だから「モル」という単位が活躍するわけです。\n\n今日の話で覚えてほしいのは、難しい数字そのものではありません。普段は気にも留めない「数え方」にも、人間の工夫が詰まっているということです。\n\n今度、卵を1ダース買うときにでも、10月23日の「モルの日」を思い出してみてください。`};

Object.assign(specialSpeeches,{"10-24": {"30": "皆さん、今日10月24日は、ちょっと考えさせられる記念日です。\n\n国連は、いつ生まれたと思いますか？\n\n1945年6月に憲章が署名されましたが、正式に発足したのは10月24日。国連憲章が効力を持った日です。\n\n約束は決めただけでは終わりません。実際に動き出して初めて意味を持つ。仕事のルールや改善策も、決めた後に実行することが大切だと感じます。", "60": "皆さん、今日10月24日は、ちょっと考えさせられる記念日です。\n\n国連は、いつ生まれたと思いますか？\n\n1945年6月に憲章が署名されましたが、正式に発足したのは10月24日。国連憲章が効力を持った日です。\n\n記念日というと、お祝いのイメージがありますよね。でも、こうした日には「忘れないために毎年思い出す」という役割もあります。\n\n約束は決めただけでは終わりません。実際に動き出して初めて意味を持つ。仕事のルールや改善策も、決めた後に実行することが大切だと感じます。\n\n今日の日付をきっかけに、一つだけ行動につなげてみたいと思います。", "180": "皆さん、今日10月24日は、ちょっと考えさせられる記念日です。\n\n突然ですが、一つ質問です。国連は、いつ生まれたと思いますか？\n\n少し意外かもしれませんが、今日の日付には、世界中の人に関係する出来事が刻まれています。\n\n1945年6月に憲章が署名されましたが、正式に発足したのは10月24日。国連憲章が効力を持った日です。\n\nここで面白いのは、ただ昔の出来事を覚えるための日ではない、ということです。毎年同じ日付が来ることで、普段は忘れがちな大切なことを、もう一度考える機会が生まれます。\n\n私たちの仕事や生活でも似たことがあります。安全確認や引き継ぎ、相手への声かけ。どれも知識としては分かっていても、忙しいと後回しになりがちです。\n\n約束は決めただけでは終わりません。実際に動き出して初めて意味を持つ。仕事のルールや改善策も、決めた後に実行することが大切だと感じます。\n\nたとえば今日、いつもは何となく済ませている確認を一つ丁寧にやってみる。それだけでも、この日付を知った意味があると思います。\n\n記念日はカレンダーの飾りではなく、行動を見直すきっかけにもなるんですね。以上、今日の日付にまつわるお話でした。"}, "11-05": {"30": "皆さん、今日11月5日は、ちょっと考えさせられる記念日です。\n\n津波の危険を知らせるとき、まず何が必要でしょうか？\n\n11月5日は「世界津波の日」。日本の「稲むらの火」にも結びつく日で、国連が津波への備えと早期警報の重要性を伝えています。\n\n災害時は、知識だけでなく行動が命を守ります。避難経路や連絡方法を普段から確認しておきたいですね。", "60": "皆さん、今日11月5日は、ちょっと考えさせられる記念日です。\n\n津波の危険を知らせるとき、まず何が必要でしょうか？\n\n11月5日は「世界津波の日」。日本の「稲むらの火」にも結びつく日で、国連が津波への備えと早期警報の重要性を伝えています。\n\n記念日というと、お祝いのイメージがありますよね。でも、こうした日には「忘れないために毎年思い出す」という役割もあります。\n\n災害時は、知識だけでなく行動が命を守ります。避難経路や連絡方法を普段から確認しておきたいですね。\n\n今日の日付をきっかけに、一つだけ行動につなげてみたいと思います。", "180": "皆さん、今日11月5日は、ちょっと考えさせられる記念日です。\n\n突然ですが、一つ質問です。津波の危険を知らせるとき、まず何が必要でしょうか？\n\n少し意外かもしれませんが、今日の日付には、世界中の人に関係する出来事が刻まれています。\n\n11月5日は「世界津波の日」。日本の「稲むらの火」にも結びつく日で、国連が津波への備えと早期警報の重要性を伝えています。\n\nここで面白いのは、ただ昔の出来事を覚えるための日ではない、ということです。毎年同じ日付が来ることで、普段は忘れがちな大切なことを、もう一度考える機会が生まれます。\n\n私たちの仕事や生活でも似たことがあります。安全確認や引き継ぎ、相手への声かけ。どれも知識としては分かっていても、忙しいと後回しになりがちです。\n\n災害時は、知識だけでなく行動が命を守ります。避難経路や連絡方法を普段から確認しておきたいですね。\n\nたとえば今日、いつもは何となく済ませている確認を一つ丁寧にやってみる。それだけでも、この日付を知った意味があると思います。\n\n記念日はカレンダーの飾りではなく、行動を見直すきっかけにもなるんですね。以上、今日の日付にまつわるお話でした。"}, "12-10": {"30": "皆さん、今日12月10日は、ちょっと考えさせられる記念日です。\n\n世界中の人の権利を示した宣言が、いつ採択されたかご存じですか？\n\n1948年12月10日、国連総会で世界人権宣言が採択されました。今日の「人権デー」は、その日付に由来します。\n\n相手を尊重することは大きな話だけではありません。普段の言葉や、違う意見に耳を傾ける姿勢から始まると思います。", "60": "皆さん、今日12月10日は、ちょっと考えさせられる記念日です。\n\n世界中の人の権利を示した宣言が、いつ採択されたかご存じですか？\n\n1948年12月10日、国連総会で世界人権宣言が採択されました。今日の「人権デー」は、その日付に由来します。\n\n記念日というと、お祝いのイメージがありますよね。でも、こうした日には「忘れないために毎年思い出す」という役割もあります。\n\n相手を尊重することは大きな話だけではありません。普段の言葉や、違う意見に耳を傾ける姿勢から始まると思います。\n\n今日の日付をきっかけに、一つだけ行動につなげてみたいと思います。", "180": "皆さん、今日12月10日は、ちょっと考えさせられる記念日です。\n\n突然ですが、一つ質問です。世界中の人の権利を示した宣言が、いつ採択されたかご存じですか？\n\n少し意外かもしれませんが、今日の日付には、世界中の人に関係する出来事が刻まれています。\n\n1948年12月10日、国連総会で世界人権宣言が採択されました。今日の「人権デー」は、その日付に由来します。\n\nここで面白いのは、ただ昔の出来事を覚えるための日ではない、ということです。毎年同じ日付が来ることで、普段は忘れがちな大切なことを、もう一度考える機会が生まれます。\n\n私たちの仕事や生活でも似たことがあります。安全確認や引き継ぎ、相手への声かけ。どれも知識としては分かっていても、忙しいと後回しになりがちです。\n\n相手を尊重することは大きな話だけではありません。普段の言葉や、違う意見に耳を傾ける姿勢から始まると思います。\n\nたとえば今日、いつもは何となく済ませている確認を一つ丁寧にやってみる。それだけでも、この日付を知った意味があると思います。\n\n記念日はカレンダーの飾りではなく、行動を見直すきっかけにもなるんですね。以上、今日の日付にまつわるお話でした。"}});

Object.assign(specialSpeeches,{"11-10":{"30":"皆さん、今日11月10日は「世界科学デー」です。\n\n11月10日はユネスコの「平和と開発のための世界科学デー」。科学が社会や暮らしに果たす役割を考え、科学と市民のつながりを深める日です。\n\n天気予報やスマートフォン、身近な医療にも科学が使われています。","60":"皆さん、今日11月10日は何の日かご存じですか？\n\n実は「世界科学デー」です。\n\n11月10日はユネスコの「平和と開発のための世界科学デー」。科学が社会や暮らしに果たす役割を考え、科学と市民のつながりを深める日です。\n\n天気予報やスマートフォン、身近な医療にも科学が使われています。\n\n難しい知識を全部覚えるより、疑問を持って確かめる姿勢が大切です。\n\n今日の記念日をきっかけに、いつもの暮らしを少し違う角度から見てみたいと思います。","180":"皆さん、今日は一つ、身近なことから始めるクイズです。\n\n今日11月10日は、何の記念日でしょうか？\n\n答えは「世界科学デー」です。\n\n11月10日はユネスコの「平和と開発のための世界科学デー」。科学が社会や暮らしに果たす役割を考え、科学と市民のつながりを深める日です。\n\nこの話を聞くと、記念日というのは、ただカレンダーに名前が載っているだけの日ではないんだと感じます。普段は意識しないことを、一年に一度、立ち止まって考えるきっかけになるんですね。\n\n天気予報やスマートフォン、身近な医療にも科学が使われています。\n\nたとえば、いつもの作業に「なぜこの手順なのか」と疑問を持つだけで、見落としていた理由や改善のヒントが見つかるかもしれません。\n\nここで大事なのは、知っただけで終わらせないことだと思います。もちろん、今日一日で何か大きなことを変える必要はありません。\n\n難しい知識を全部覚えるより、疑問を持って確かめる姿勢が大切です。\n\n例えば今日、普段なら見過ごしてしまうことに一つ気づいてみる。誰かに一声かける。身近な仕組みの理由を確かめてみる。そんな小さな行動なら、無理なく始められそうです。\n\n記念日を知る面白さは、昔の出来事や世界の課題が、今の自分の行動につながるところにあるのかもしれません。\n\n以上、今日11月10日にまつわるお話でした。"},"11-19":{"30":"皆さん、今日11月19日は「世界トイレの日」です。\n\n11月19日は国連の「世界トイレの日」。安全に利用できる衛生設備の大切さや、世界で衛生環境の整備が必要とされている現状を考える日です。\n\n普段、清潔なトイレを使えることを当たり前に感じていませんか。","60":"皆さん、今日11月19日は何の日かご存じですか？\n\n実は「世界トイレの日」です。\n\n11月19日は国連の「世界トイレの日」。安全に利用できる衛生設備の大切さや、世界で衛生環境の整備が必要とされている現状を考える日です。\n\n普段、清潔なトイレを使えることを当たり前に感じていませんか。\n\n身近な設備ほど、使えることのありがたさを忘れがちです。\n\n今日の記念日をきっかけに、いつもの暮らしを少し違う角度から見てみたいと思います。","180":"皆さん、今日は一つ、身近なことから始めるクイズです。\n\n今日11月19日は、何の記念日でしょうか？\n\n答えは「世界トイレの日」です。\n\n11月19日は国連の「世界トイレの日」。安全に利用できる衛生設備の大切さや、世界で衛生環境の整備が必要とされている現状を考える日です。\n\nこの話を聞くと、記念日というのは、ただカレンダーに名前が載っているだけの日ではないんだと感じます。普段は意識しないことを、一年に一度、立ち止まって考えるきっかけになるんですね。\n\n普段、清潔なトイレを使えることを当たり前に感じていませんか。\n\n職場でも、毎日使う設備がきちんと動いているのは、点検や清掃をしてくれる人がいるからです。気づきにくい支えに目を向けたいですね。\n\nここで大事なのは、知っただけで終わらせないことだと思います。もちろん、今日一日で何か大きなことを変える必要はありません。\n\n身近な設備ほど、使えることのありがたさを忘れがちです。\n\n例えば今日、普段なら見過ごしてしまうことに一つ気づいてみる。誰かに一声かける。身近な仕組みの理由を確かめてみる。そんな小さな行動なら、無理なく始められそうです。\n\n記念日を知る面白さは、昔の出来事や世界の課題が、今の自分の行動につながるところにあるのかもしれません。\n\n以上、今日11月19日にまつわるお話でした。"},"12-05":{"30":"皆さん、今日12月5日は「国際ボランティア・デー」です。\n\n12月5日は国連の「国際ボランティア・デー」。ボランティアの貢献を認め、地域や社会を支える活動への理解を深める日です。\n\n大きな活動だけでなく、身近な助け合いにも目を向けるきっかけになります。","60":"皆さん、今日12月5日は何の日かご存じですか？\n\n実は「国際ボランティア・デー」です。\n\n12月5日は国連の「国際ボランティア・デー」。ボランティアの貢献を認め、地域や社会を支える活動への理解を深める日です。\n\n大きな活動だけでなく、身近な助け合いにも目を向けるきっかけになります。\n\n誰かの負担を少し軽くする行動は、特別な肩書がなくてもできます。\n\n今日の記念日をきっかけに、いつもの暮らしを少し違う角度から見てみたいと思います。","180":"皆さん、今日は一つ、身近なことから始めるクイズです。\n\n今日12月5日は、何の記念日でしょうか？\n\n答えは「国際ボランティア・デー」です。\n\n12月5日は国連の「国際ボランティア・デー」。ボランティアの貢献を認め、地域や社会を支える活動への理解を深める日です。\n\nこの話を聞くと、記念日というのは、ただカレンダーに名前が載っているだけの日ではないんだと感じます。普段は意識しないことを、一年に一度、立ち止まって考えるきっかけになるんですね。\n\n大きな活動だけでなく、身近な助け合いにも目を向けるきっかけになります。\n\n忙しそうな人に一声かける、落ちているごみを拾う、困っている人に道を教える。小さな行動でも、受け取る側にとっては大きな助けになることがあります。\n\nここで大事なのは、知っただけで終わらせないことだと思います。もちろん、今日一日で何か大きなことを変える必要はありません。\n\n誰かの負担を少し軽くする行動は、特別な肩書がなくてもできます。\n\n例えば今日、普段なら見過ごしてしまうことに一つ気づいてみる。誰かに一声かける。身近な仕組みの理由を確かめてみる。そんな小さな行動なら、無理なく始められそうです。\n\n記念日を知る面白さは、昔の出来事や世界の課題が、今の自分の行動につながるところにあるのかもしれません。\n\n以上、今日12月5日にまつわるお話でした。"},"12-11":{"30":"皆さん、今日12月11日は「国際山岳デー」です。\n\n12月11日は国連の「国際山岳デー」。山々が水や生態系、人々の暮らしを支える役割に注目し、山岳地域の持続可能な発展を考える日です。\n\n山は登山を楽しむ場所というだけではありません。","60":"皆さん、今日12月11日は何の日かご存じですか？\n\n実は「国際山岳デー」です。\n\n12月11日は国連の「国際山岳デー」。山々が水や生態系、人々の暮らしを支える役割に注目し、山岳地域の持続可能な発展を考える日です。\n\n山は登山を楽しむ場所というだけではありません。\n\n遠くに見える自然も、私たちの生活とつながっています。\n\n今日の記念日をきっかけに、いつもの暮らしを少し違う角度から見てみたいと思います。","180":"皆さん、今日は一つ、身近なことから始めるクイズです。\n\n今日12月11日は、何の記念日でしょうか？\n\n答えは「国際山岳デー」です。\n\n12月11日は国連の「国際山岳デー」。山々が水や生態系、人々の暮らしを支える役割に注目し、山岳地域の持続可能な発展を考える日です。\n\nこの話を聞くと、記念日というのは、ただカレンダーに名前が載っているだけの日ではないんだと感じます。普段は意識しないことを、一年に一度、立ち止まって考えるきっかけになるんですね。\n\n山は登山を楽しむ場所というだけではありません。\n\n山に降った雨や雪は川の水につながり、森は多くの生き物のすみかにもなります。身近な景色の向こうにある働きを、少し想像してみるのもいいですね。\n\nここで大事なのは、知っただけで終わらせないことだと思います。もちろん、今日一日で何か大きなことを変える必要はありません。\n\n遠くに見える自然も、私たちの生活とつながっています。\n\n例えば今日、普段なら見過ごしてしまうことに一つ気づいてみる。誰かに一声かける。身近な仕組みの理由を確かめてみる。そんな小さな行動なら、無理なく始められそうです。\n\n記念日を知る面白さは、昔の出来事や世界の課題が、今の自分の行動につながるところにあるのかもしれません。\n\n以上、今日12月11日にまつわるお話でした。"}});
function render(){const f=getFact(selected),t=f?f.title:'この日の雑学は調査中',body=f?f.fact:'この日付に直接関係する、出典を確認できた雑学を準備しています。別の日付も選んでみてね。';$('dayTitle').textContent=t;$('dayFact').textContent=body;$('dayLabel').textContent=f?f.label:'未収録';$('source').replaceChildren();if(f){let a=document.createElement('a');a.href=f.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=f.calendarComputed?'暦の計算方法を確認する ↗':f.provisional?'暦の参考資料 ↗':'参考資料を確認する ↗';$('source').append('参考：',a)}else{$('source').textContent='出典確認済みの内容のみ順次公開します。'}speechText=buildSpeech(f,length);$('copy').textContent='原稿をコピー';$('speech').textContent=speechText;if(length===180&&!specialSpeeches[key(selected)])$('speech').textContent+='\n\n※この原稿は3分より短い場合があります。';document.querySelectorAll('[data-len]').forEach(b=>b.classList.toggle('active',Number(b.dataset.len)===length));}
function init(){ $('today').textContent=jp(todayDate);let f=getFact(todayDate);$('heroTitle').textContent=f?f.title:'今日の雑学を準備中';$('heroFact').textContent=f?f.fact:'日付に関連する、確認済みの雑学を追加しています。';$('heroLabel').textContent=f?`📌 ${f.label}`:'※未収録の日は無理に作りません';$('dateInput').value=iso(todayDate);render();}
$('speechOpen').onclick=()=>show('day');document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));$('dateInput').onchange=e=>{if(!e.target.value)return;const [y,m,d]=e.target.value.split('-').map(Number);const parsed=fromInput(e.target.value);if(!parsed)return;selected=parsed;render()};$('reset').onclick=()=>{selected=new Date();$('dateInput').value=iso(selected);render()};document.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{length=Number(b.dataset.len);render()});$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(speechText);$('copy').textContent='コピーできたよ ✓';setTimeout(()=>$('copy').textContent='原稿をコピー',1600)}catch(e){alert('コピーできませんでした。原稿を長押ししてコピーしてください。')}};
const utc=d=>Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()),days=(a,b)=>Math.round((utc(b)-utc(a))/86400000),fromInput=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return null;const [y,m,d]=v.split('-').map(Number);const date=new Date(0);date.setFullYear(y,m-1,d);date.setHours(12,0,0,0);return date.getFullYear()===y&&date.getMonth()===m-1&&date.getDate()===d?date:null};
$('calcBirth').onclick=()=>{let d=fromInput($('birthday').value);$('birthResult').textContent=!d?'生年月日を入力してね。':days(d,todayDate)<0?'未来の日付は選べません。':`${jp(d)}生まれ\n生まれた曜日：${'日月火水木金土'[d.getDay()]}曜日\n生まれてから：${days(d,todayDate).toLocaleString()}日経過`};$('calcLove').onclick=()=>{let d=fromInput($('startDate').value);if(!d){$('loveResult').textContent='日付を入力してね。';return}let s='';for(const n of [100,500,1000,10000]){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n-1,12);s+=`${n.toLocaleString()}日記念日：${jp(x)}\n`}$('loveResult').textContent=s};init();
</script></body></html>
